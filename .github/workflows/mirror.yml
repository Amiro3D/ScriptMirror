name: Mirror Single Page

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL of the page to mirror (single page + assets)'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download page and all static assets
        run: |
          mkdir -p mirrored-site
          wget -r -l 1 -p -k -E \
               --no-parent \
               --span-hosts \
               --accept="*.html,*.css,*.js,*.png,*.jpg,*.jpeg,*.gif,*.svg,*.webp,*.ico" \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               --directory-prefix=mirrored-site \
               "${{ github.event.inputs.website_url }}"

      - name: Create ZIP archive
        run: zip -r mirrored-site.zip mirrored-site/

      - name: Split ZIP if >45MB
        run: |
          SIZE=$(stat -c%s "mirrored-site.zip")
          if [ $SIZE -gt 47185920 ]; then
            zip -s 45m mirrored-site.zip --out split.zip
            rm mirrored-site.zip
            mv split.z* mirrored-site.zip.part* 2>/dev/null || true
          fi

      - name: List downloaded files (debug)
        run: ls -la mirrored-site/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mirror-${{ github.event.inputs.request_id }}
          name: "Mirror ${{ github.event.inputs.request_id }}"
          draft: false
          prerelease: false
          files: |
            mirrored-site.zip*
            *.zip
            *.z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
