name: Mirror Single Page

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL of the page to mirror (single page + assets)'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download single page and its assets
        run: |
          mkdir -p mirrored-site
          wget -p -k -E -l 1 --no-parent --span-hosts \
               --directory-prefix=mirrored-site \
               "${{ github.event.inputs.website_url }}"

      - name: Create ZIP archive
        run: zip -r mirrored-site.zip mirrored-site/

      - name: Split ZIP into 45MB parts (same method as file fetch)
        run: |
          MAX_SIZE=47185920
          SIZE=$(stat -c%s "mirrored-site.zip")
          if [ $SIZE -gt $MAX_SIZE ]; then
            echo "ZIP larger than 45MB, splitting..."
            zip -s 45m mirrored-site.zip --out split.zip
            rm mirrored-site.zip
            # rename split.z01, split.z02, split.zip to clean names
            mv split.z* mirrored-site.zip.part* 2>/dev/null || true
          fi

      - name: List files for debugging
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mirror-${{ github.event.inputs.request_id }}
          name: "Mirror ${{ github.event.inputs.request_id }}"
          draft: false
          prerelease: false
          files: |
            mirrored-site.zip*
            *.zip
            *.z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
