name: Mirror Single Page

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL of the page to mirror (single page + assets only)'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download single page and its assets (no other HTML)
        run: |
          mkdir -p mirrored-site
          # -p : download page requisites (CSS, JS, images)
          # -k : convert links for local viewing
          # -E : add .html extension if missing
          # --no-parent : stay under the starting URL
          # --span-hosts : allow CDN assets
          # --accept : include all common web files
          wget -p -k -E \
               --no-parent \
               --span-hosts \
               --accept="*.html,*.css,*.js,*.png,*.jpg,*.jpeg,*.gif,*.svg,*.webp,*.ico,*.woff,*.woff2,*.ttf" \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               --directory-prefix=mirrored-site \
               "${{ github.event.inputs.website_url }}"

      - name: Create ZIP archive
        run: zip -r mirrored-site.zip mirrored-site/

      - name: Split ZIP if >45MB (same method as file fetch)
        run: |
          SIZE=$(stat -c%s "mirrored-site.zip")
          if [ $SIZE -gt 47185920 ]; then
            echo "ZIP larger than 45MB, splitting..."
            zip -s 45m mirrored-site.zip --out split.zip
            rm mirrored-site.zip
            mv split.z* mirrored-site.zip.part* 2>/dev/null || true
          fi

      - name: List downloaded files (debug)
        run: ls -la mirrored-site/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mirror-${{ github.event.inputs.request_id }}
          name: "Mirror ${{ github.event.inputs.request_id }}"
          draft: false
          prerelease: false
          files: |
            mirrored-site.zip*
            *.zip
            *.z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
