name: Mirror Single Page

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL of the page to mirror (single page + assets only)'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download single page and its assets
        run: |
          mkdir -p mirrored-site
          wget -p -k -E -l 1 --no-parent --span-hosts \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
               --directory-prefix=mirrored-site \
               "${{ github.event.inputs.website_url }}"

      - name: Create ZIP archive
        run: |
          cd mirrored-site
          zip -r ../mirrored-site.zip .
          cd ..
          ls -la mirrored-site.zip

      - name: Split ZIP if >45MB
        run: |
          SIZE=$(stat -c%s "mirrored-site.zip")
          if [ $SIZE -gt 47185920 ]; then
            echo "ZIP larger than 45MB, splitting..."
            zip -s 45m mirrored-site.zip --out split.zip
            rm mirrored-site.zip
            mv split.z* mirrored-site.zip.part* 2>/dev/null || true
          fi

      - name: List final assets
        run: ls -la mirrored-site.zip* || true

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="mirror-${{ github.event.inputs.request_id }}"
          # Create the release (or update if exists)
          gh release create "$TAG" --title "Mirror ${{ github.event.inputs.request_id }}" --notes "Mirrored page" --draft=false --prerelease=false || true
          # Upload all matching files (single zip or split parts)
          for file in mirrored-site.zip*; do
            if [ -f "$file" ]; then
              echo "Uploading $file"
              gh release upload "$TAG" "$file" --clobber
            fi
          done
