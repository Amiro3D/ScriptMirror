name: Mirror Website to Drive

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL of the website to mirror'
        required: true
        default: 'https://en.wikipedia.org/wiki/Web_scraping'
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror website with wget
        run: |
          mkdir -p mirrored-site
          wget --mirror --convert-links --adjust-extension \
               --page-requisites --no-parent \
               --directory-prefix=mirrored-site \
               "${{ github.event.inputs.website_url }}"

      - name: Create ZIP archive
        run: zip -r mirrored-site.zip mirrored-site/

      - name: Create GitHub Release and upload ZIP
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mirror-${{ github.run_id }}
          name: "Mirror ${{ github.run_id }}"
          draft: false
          prerelease: false
          files: mirrored-site.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get asset download URL
        id: get_url
        run: |
          ASSET_URL=$(gh api repos/${{ github.repository }}/releases/tags/mirror-${{ github.run_id }} --jq '.assets[0].browser_download_url')
          echo "DOWNLOAD_URL=$ASSET_URL" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send download URL to Google Apps Script
        run: |
          curl -X POST "${{ secrets.GAS_DEPLOYMENT_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"downloadUrl": "${{ steps.get_url.outputs.DOWNLOAD_URL }}", "fileName": "mirrored-site.zip"}'
