name: Mirror Single Page (Static Only)

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL to mirror (static pages only)'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download page, assets, and scripts (level 2)
        run: |
          mkdir -p mirrored-site
          wget -r -l 2 -p -k -E --no-parent --span-hosts \
               --accept="*.html,*.css,*.js,*.json,*.png,*.jpg,*.jpeg,*.gif,*.svg,*.webp,*.ico,*.woff,*.woff2,*.ttf" \
               --reject="*.gz" \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0" \
               --header="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
               --header="Accept-Language: en-US,en;q=0.5" \
               --header="Referer: https://www.google.com/" \
               --retry-connrefused --tries=3 --timeout=30 \
               --directory-prefix=mirrored-site \
               "${{ github.event.inputs.website_url }}"

      - name: Remove query parameters from downloaded filenames
        run: |
          find mirrored-site -type f | while read f; do
            newname=$(echo "$f" | sed 's/\?.*//' | sed 's/\.tmp$//' | sed 's/\.tmp\(\.css\)$/\1/' | sed 's/\.tmp\(\.js\)$/\1/')
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname" 2>/dev/null || true
            fi
          done

      - name: Create ZIP (preserve full folder structure)
        run: |
          cd mirrored-site
          zip -r ../mirrored-site.zip .
          cd ..
          ls -la mirrored-site.zip

      - name: Split ZIP if >45MB
        run: |
          SIZE=$(stat -c%s "mirrored-site.zip")
          if [ $SIZE -gt 47185920 ]; then
            zip -s 45m mirrored-site.zip --out split.zip
            rm mirrored-site.zip
            mv split.z* mirrored-site.zip.part* 2>/dev/null || true
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirror-${{ github.event.inputs.request_id }}
          name: "Mirror ${{ github.event.inputs.request_id }}"
          draft: false
          prerelease: false
          files: |
            mirrored-site.zip*
            *.zip
            *.z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
