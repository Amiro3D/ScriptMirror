name: Mirror Website

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL to mirror'
        required: true
        type: string
      request_id:
        description: 'Unique request ID (e.g., UUID or timestamp)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror website with wget
        run: |
          mkdir -p mirrored-site
          wget --mirror --convert-links --adjust-extension \
               --page-requisites --no-parent \
               --directory-prefix=mirrored-site \
               "${{ github.event.inputs.website_url }}"

      - name: Create ZIP archive
        run: zip -r mirrored-site.zip mirrored-site/

      - name: Split ZIP into 45MB parts (if needed)
        run: |
          SIZE=$(stat -c%s "mirrored-site.zip")
          if [ $SIZE -gt 45000000 ]; then
            echo "File larger than 45MB, splitting..."
            split -b 45m mirrored-site.zip mirrored-site.zip.part
            rm mirrored-site.zip
            echo "SPLIT=true" >> $GITHUB_ENV
          else
            echo "SPLIT=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release with unique tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mirror-${{ github.event.inputs.request_id }}
          name: "Mirror ${{ github.event.inputs.request_id }}"
          draft: false
          prerelease: false
          files: mirrored-site.zip*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
