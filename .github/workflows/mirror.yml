name: Mirror Single Page

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL of the page to mirror (single page + assets only)'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download page and assets with full browser headers
        run: |
          mkdir -p mirrored-site
          wget -p -k -E -l 1 --no-parent --span-hosts \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0" \
               --header="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
               --header="Accept-Language: en-US,en;q=0.5" \
               --header="Accept-Encoding: gzip, deflate, br" \
               --header="Referer: https://www.google.com/" \
               --header="Upgrade-Insecure-Requests: 1" \
               --header="Cache-Control: no-cache" \
               --header="Connection: keep-alive" \
               --retry-connrefused --tries=3 --timeout=30 \
               --directory-prefix=mirrored-site \
               "${{ github.event.inputs.website_url }}"

      - name: Decompress all gzipped files (fix .js.gz, .css.gz, etc.)
        run: |
          find mirrored-site -type f -name "*.gz" | while read gzfile; do
            echo "Decompressing $gzfile"
            gunzip -f "$gzfile"
          done

      - name: Create ZIP archive
        run: |
          cd mirrored-site
          zip -r ../mirrored-site.zip .
          cd ..
          ls -la mirrored-site.zip

      - name: Split ZIP if >45MB
        run: |
          SIZE=$(stat -c%s "mirrored-site.zip")
          if [ $SIZE -gt 47185920 ]; then
            echo "ZIP larger than 45MB, splitting..."
            zip -s 45m mirrored-site.zip --out split.zip
            rm mirrored-site.zip
            mv split.z* mirrored-site.zip.part* 2>/dev/null || true
          fi

      - name: List final assets
        run: ls -la mirrored-site.zip* || true

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirror-${{ github.event.inputs.request_id }}
          name: "Mirror ${{ github.event.inputs.request_id }}"
          draft: false
          prerelease: false
          files: |
            mirrored-site.zip*
            *.zip
            *.z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
