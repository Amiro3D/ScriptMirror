name: Mirror Single Page

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'URL of the page to mirror (single page + assets only)'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download page and all static assets
        run: |
          mkdir -p mirrored-site
          wget -p -k -E -l 1 --no-parent --span-hosts \
               --accept="*.html,*.css,*.js,*.png,*.jpg,*.jpeg,*.gif,*.svg,*.webp,*.ico,*.woff,*.woff2,*.ttf,*.mp4,*.webm,*.ogg" \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:133.0) Gecko/20100101 Firefox/133.0" \
               --header="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
               --header="Accept-Language: en-US,en;q=0.5" \
               --header="Referer: https://www.google.com/" \
               --header="Upgrade-Insecure-Requests: 1" \
               --retry-connrefused --tries=3 --timeout=30 \
               --directory-prefix=mirrored-site \
               "${{ github.event.inputs.website_url }}"

      - name: Clean up filenames (remove query strings and .tmp)
        run: |
          find mirrored-site -type f | while read f; do
            newname=$(echo "$f" | sed 's/\.tmp$//' | sed 's/\.tmp\(\.css\)$/\1/' | sed 's/\.tmp\(\.js\)$/\1/')
            newname=$(echo "$newname" | sed 's/\?.*$//')
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname" 2>/dev/null || true
            fi
          done

      - name: Fix HTML links (remove absolute URLs and domain prefixes)
        run: |
          find mirrored-site -name "*.html" -exec sed -i 's|https://[^/]*||g' {} \;

      - name: Identify the main domain folder (contains index.html)
        id: find_domain
        run: |
          # Find the deepest index.html (likely the main page)
          MAIN_HTML=$(find mirrored-site -name "*.html" | head -1)
          MAIN_DIR=$(dirname "$MAIN_HTML")
          echo "main_dir=$MAIN_DIR" >> $GITHUB_OUTPUT
          echo "Zipping from $MAIN_DIR"

      - name: Create ZIP from the domain folder (not the parent)
        run: |
          cd "${{ steps.find_domain.outputs.main_dir }}"
          zip -r ../../mirrored-site.zip .
          cd ../..
          ls -la mirrored-site.zip

      - name: Split ZIP if >45MB
        run: |
          SIZE=$(stat -c%s "mirrored-site.zip")
          if [ $SIZE -gt 47185920 ]; then
            echo "ZIP larger than 45MB, splitting..."
            zip -s 45m mirrored-site.zip --out split.zip
            rm mirrored-site.zip
            mv split.z* mirrored-site.zip.part* 2>/dev/null || true
          fi

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirror-${{ github.event.inputs.request_id }}
          name: "Mirror ${{ github.event.inputs.request_id }}"
          draft: false
          prerelease: false
          files: |
            mirrored-site.zip*
            *.zip
            *.z*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
