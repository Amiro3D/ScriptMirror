name: Extract MediaFire Direct Link

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: 'MediaFire share URL'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract MediaFire direct link
        id: extract
        run: |
          MEDIAFIRE_URL="${{ github.event.inputs.mediafire_url }}"
          
          # Use an alternative API (vxmediafire - public instance)
          API_URL="https://api.vxparser.com/mediafire?url=$(echo -n "$MEDIAFIRE_URL" | jq -sRr @uri)"
          
          RESPONSE=$(curl -s "$API_URL")
          DIRECT_URL=$(echo "$RESPONSE" | jq -r '.direct_link // .url // empty')
          
          if [ -z "$DIRECT_URL" ] || [ "$DIRECT_URL" = "null" ]; then
            # Fallback to direct scraping
            echo "API failed, falling back to direct scraping..."
            HTML=$(curl -s -L -b /tmp/cookies.txt -c /tmp/cookies.txt \
              -H "User-Agent: Mozilla/5.0" "$MEDIAFIRE_URL")
            
            # Extract download link
            DIRECT_URL=$(echo "$HTML" | grep -oP 'https?://download[^\s"]+' | head -1)
            if [ -z "$DIRECT_URL" ]; then
              DIRECT_URL=$(echo "$HTML" | grep -oP 'https?://[^"]*mediafire[^"]*download[^"]*' | head -1)
            fi
          fi
          
          if [ -z "$DIRECT_URL" ]; then
            echo "ERROR: Could not extract direct link"
            exit 1
          fi
          
          # Get filename
          FILENAME=$(curl -s -I "$DIRECT_URL" | grep -i 'content-disposition' | grep -oP 'filename="?\K[^"]+' | head -1)
          if [ -z "$FILENAME" ]; then
            FILENAME=$(basename "$DIRECT_URL" | cut -d '?' -f1)
          fi
          
          echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Send direct link to Apps Script
        run: |
          curl -X POST "${{ secrets.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "mediafire_callback",
              "request_id": "${{ github.event.inputs.request_id }}",
              "direct_url": "${{ steps.extract.outputs.direct_url }}",
              "filename": "${{ steps.extract.outputs.filename }}"
            }'
