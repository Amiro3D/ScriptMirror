name: Extract MediaFire Direct Link

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: 'MediaFire share URL'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install mediafire-dl
        run: |
          pip install mediafire-dl

      - name: Extract MediaFire direct link
        id: extract
        run: |
          MEDIAFIRE_URL="${{ github.event.inputs.mediafire_url }}"
          
          # Use mediafire-dl to get the direct link without downloading
          python << 'EOF'
          import subprocess
          import re
          import json
          
          url = "${{ github.event.inputs.mediafire_url }}"
          
          # Run mediafire-dl to get direct link
          result = subprocess.run(['mediafire-dl', '--get-url', url], 
                                  capture_output=True, text=True)
          
          output = result.stdout
          
          # Extract direct URL from output
          match = re.search(r'https?://[^\s]+', output)
          direct_url = match.group(0) if match else ''
          
          # Extract filename from URL
          filename = direct_url.split('/')[-1].split('?')[0]
          
          if not direct_url:
              # Alternative: use curl as fallback
              import requests
              response = requests.get(url, headers={'User-Agent': 'Mozilla/5.0'})
              html = response.text
              # Find download link patterns
              patterns = [
                  r'downloadButton["\']\s*data-link=["\']([^"\']+)',
                  r'<a[^>]+href=["\']([^"\']+download[^"\']+)',
              ]
              for pattern in patterns:
                  match = re.search(pattern, html)
                  if match:
                      direct_url = match.group(1)
                      if direct_url.startswith('//'):
                          direct_url = 'https:' + direct_url
                      break
          
          # Save to GitHub output
          with open('/tmp/direct_url.txt', 'w') as f:
              f.write(direct_url)
          with open('/tmp/filename.txt', 'w') as f:
              f.write(filename)
          
          print(f"direct_url={direct_url}")
          print(f"filename={filename}")
          EOF
          
          DIRECT_URL=$(cat /tmp/direct_url.txt)
          FILENAME=$(cat /tmp/filename.txt)
          
          echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Send direct link to Apps Script
        run: |
          curl -X POST "${{ secrets.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "mediafire_callback",
              "request_id": "${{ github.event.inputs.request_id }}",
              "direct_url": "${{ steps.extract.outputs.direct_url }}",
              "filename": "${{ steps.extract.outputs.filename }}"
            }'
