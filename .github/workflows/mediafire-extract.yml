name: Extract MediaFire Direct Link

on:
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: 'MediaFire share URL'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract MediaFire direct link with curl
        id: extract
        run: |
          MEDIAFIRE_URL="${{ github.event.inputs.mediafire_url }}"
          echo "Processing: $MEDIAFIRE_URL"
          
          # Fetch the MediaFire page
          RESPONSE=$(curl -s -L -b /tmp/cookies.txt -c /tmp/cookies.txt \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "$MEDIAFIRE_URL")
          
          # Extract the direct download link using grep and sed
          # MediaFire stores the download link in a JavaScript variable or data-link attribute
          DIRECT_URL=$(echo "$RESPONSE" | grep -oP 'downloadButton[^"]*"\Khttps?://[^"]+' | head -1)
          
          if [ -z "$DIRECT_URL" ]; then
            # Alternative: look for data-link or href in download button
            DIRECT_URL=$(echo "$RESPONSE" | grep -oP 'data-link="\K[^"]+' | head -1)
          fi
          
          if [ -z "$DIRECT_URL" ]; then
            # Another pattern: look for link in the download div
            DIRECT_URL=$(echo "$RESPONSE" | grep -oP 'https?://[^"]*download[^"]*' | head -1)
          fi
          
          if [ -z "$DIRECT_URL" ]; then
            echo "Failed to extract direct link"
            exit 1
          fi
          
          # Extract filename
          FILENAME=$(curl -s -I "$DIRECT_URL" | grep -i 'content-disposition' | grep -oP 'filename="?\K[^"]+' | head -1)
          if [ -z "$FILENAME" ]; then
            FILENAME=$(basename "$DIRECT_URL" | cut -d '?' -f1)
          fi
          
          echo "Direct URL: $DIRECT_URL"
          echo "Filename: $FILENAME"
          
          echo "direct_url=$DIRECT_URL" >> $GITHUB_OUTPUT
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Send direct link to Apps Script
        run: |
          curl -X POST "${{ secrets.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "mediafire_callback",
              "request_id": "${{ github.event.inputs.request_id }}",
              "direct_url": "${{ steps.extract.outputs.direct_url }}",
              "filename": "${{ steps.extract.outputs.filename }}"
            }'
