name: Download and Split File

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct download URL'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  split-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download file with original name
        run: |
          # Get filename from URL or Content-Disposition
          FILENAME=$(curl -s -L -I "${{ github.event.inputs.file_url }}" | grep -i 'content-disposition' | grep -oP 'filename="?\K[^"]+' | tail -1)
          if [ -z "$FILENAME" ]; then
            FILENAME=$(basename "${{ github.event.inputs.file_url }}" | cut -d '?' -f1)
          fi
          if [ -z "$FILENAME" ]; then
            FILENAME="downloaded_file"
          fi
          # Add timestamp to avoid collisions
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          NAME="${FILENAME%.*}_${TIMESTAMP}.${FILENAME##*.}"
          curl -L -o "$NAME" "${{ github.event.inputs.file_url }}"
          echo "ORIGINAL_NAME=$NAME" >> $GITHUB_ENV

      - name: Split into 45MB zip parts (if needed)
        run: |
          MAX_SIZE=47185920  # 45 MiB in bytes
          FILE_SIZE=$(stat -c%s "$ORIGINAL_NAME")
          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "File size $FILE_SIZE > 45MB, splitting into 45MB zip parts"
            # Create a zip archive and split into 45MB segments
            zip -s 45m "${ORIGINAL_NAME%.*}.zip" "$ORIGINAL_NAME"
            # Remove the original large file
            rm "$ORIGINAL_NAME"
          else
            echo "File size within limit (${FILE_SIZE} bytes), keeping as single file"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: file-${{ github.event.inputs.request_id }}
          name: "File ${{ github.event.inputs.request_id }}"
          draft: false
          prerelease: false
          files: |
            *.zip
            *.z0*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
