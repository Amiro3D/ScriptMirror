name: Download and Split File

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct download URL'
        required: true
        type: string
      request_id:
        description: 'Unique request ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  split-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download file with original name and timestamp
        run: |
          # Get filename from URL or Content-Disposition
          FILENAME=$(curl -s -L -I "${{ github.event.inputs.file_url }}" | grep -i 'content-disposition' | grep -oP 'filename="?\K[^"]+' | tail -1)
          if [ -z "$FILENAME" ]; then
            FILENAME=$(basename "${{ github.event.inputs.file_url }}" | cut -d '?' -f1)
          fi
          if [ -z "$FILENAME" ]; then
            FILENAME="downloaded_file"
          fi
          # Add timestamp
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          NAME="${FILENAME%.*}_${TIMESTAMP}.${FILENAME##*.}"
          curl -L -o "$NAME" "${{ github.event.inputs.file_url }}"
          echo "ORIGINAL_NAME=$NAME" >> $GITHUB_ENV

      - name: Split into 45MB parts (if needed)
        run: |
          SIZE=$(stat -c%s "$ORIGINAL_NAME")
          if [ $SIZE -gt 45000000 ]; then
            echo "File larger than 45MB, splitting..."
            split -b 45m "$ORIGINAL_NAME" part.
            rm "$ORIGINAL_NAME"
            echo "SPLIT=true" >> $GITHUB_ENV
          else
            echo "SPLIT=false" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: file-${{ github.event.inputs.request_id }}
          name: "File ${{ github.event.inputs.request_id }}"
          draft: false
          prerelease: false
          files: |
            part.*
            *.zip
            *.tar.gz
            *.tar
            *.7z
            *.pdf
            *.jpg
            *.png
            *.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
